global:
  scrape_interval: 10s
  scrape_timeout: 10s
  evaluation_interval: 10s

scrape_configs:
  # Targets live in files under targets/ rather than inline, because prometheus.yml
  # does not support environment variable expansion. Point each deployment at a
  # different targets file instead of editing this config:
  #   local dev  -> targets/otel-collector.json  ("otel-collector:8889")
  #   production -> targets/otel-collector.prod.json  ("<app-host>:8889")
  - job_name: "otel-collector-spanmetrics"
    scrape_interval: 10s
    scrape_timeout: 10s
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.json"]
        refresh_interval: 30s