services:

  tempo:
    image: grafana/tempo:2.4.1
    container_name: obs-tempo
    restart: unless-stopped

    command:
      - "-config.file=/etc/tempo/tempo.yaml"

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 30s

    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo

    ports:
      # Remote collector pushes traces here
      - "${TEMPO_OTLP_GRPC_PORT:-4317}:4317"
      - "${TEMPO_OTLP_HTTP_PORT:-4318}:4318"
      # Query API (Grafana / operators)
      - "${TEMPO_QUERY_PORT:-3200}:3200"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --tries=1 -O- http://localhost:3200/ready || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 25s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

    deploy:
      resources:
        limits:
          cpus: "${TEMPO_CPU_LIMIT:-2.0}"
          memory: "${TEMPO_MEMORY_LIMIT:-2G}"
        reservations:
          cpus: "0.5"
          memory: 512M

    networks:
      - observability_net


  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: obs-prometheus
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 2m

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--enable-feature=exemplar-storage"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-20GB}"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus

    ports:
      # Prometheus Web UI & Query API (Grafana / operators)
      - "${PROMETHEUS_PORT:-9090}:9090"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --tries=1 -O- http://localhost:9090/-/healthy || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

    deploy:
      resources:
        limits:
          cpus: "${PROMETHEUS_CPU_LIMIT:-2.0}"
          memory: "${PROMETHEUS_MEMORY_LIMIT:-2G}"
        reservations:
          cpus: "0.5"
          memory: 512M

    networks:
      - observability_net


volumes:
  tempo_data:
  prometheus_data:


networks:
  observability_net:
    driver: bridge
