services:
  tempo:
    image: grafana/tempo:2.4.1
    container_name: obs-tempo
    restart: unless-stopped
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    volumes:
      - ./tempo/tempo-config.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      # OTLP Ingestion: Bound to TEMPO_BIND_IP (default: 0.0.0.0 or private VPC IP)
      - "${TEMPO_BIND_IP:-0.0.0.0}:${TEMPO_OTLP_GRPC_PORT:-4317}:4317" # OTLP gRPC - trace push from App Server Collector
      - "${TEMPO_BIND_IP:-0.0.0.0}:${TEMPO_OTLP_HTTP_PORT:-4318}:4318" # OTLP HTTP
      # Query API: Bound to 127.0.0.1 by default (Grafana queries Tempo via internal Docker network)
      - "${TEMPO_QUERY_BIND_IP:-127.0.0.1}:${TEMPO_QUERY_PORT:-3200}:3200" # Tempo HTTP query API
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --tries=1 -O- http://localhost:3200/ready || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "${TEMPO_CPU_LIMIT:-2.0}"
          memory: ${TEMPO_MEMORY_LIMIT:-2G}
        reservations:
          cpus: "${TEMPO_CPU_RESERVATION:-0.5}"
          memory: ${TEMPO_MEMORY_RESERVATION:-512M}
    networks:
      - observability_net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: obs-prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 2m
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--enable-feature=exemplar-storage"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-20GB}"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    ports:
      # Prometheus Web/API: Bound to 127.0.0.1 by default (Grafana queries Prometheus via internal network)
      - "${PROMETHEUS_BIND_IP:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090" # Web UI & Query API
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --tries=1 -O- http://localhost:9090/-/healthy || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "${PROMETHEUS_CPU_LIMIT:-2.0}"
          memory: ${PROMETHEUS_MEMORY_LIMIT:-2G}
        reservations:
          cpus: "${PROMETHEUS_CPU_RESERVATION:-0.5}"
          memory: ${PROMETHEUS_MEMORY_RESERVATION:-512M}
    networks:
      - observability_net

  grafana:
    image: grafana/grafana:12.4.10
    container_name: obs-grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      # Security & Authentication (Production Defaults)
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      - GF_SECURITY_SECRET_KEY=${GF_SECURITY_SECRET_KEY:?set GF_SECURITY_SECRET_KEY in .env}
      - GF_SECURITY_COOKIE_SECURE=${GF_SECURITY_COOKIE_SECURE:-false}
      - GF_SECURITY_ALLOW_EMBEDDING=${GF_SECURITY_ALLOW_EMBEDDING:-false}
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED:-false}
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-%(protocol)s://%(domain)s:%(http_port)s/}
      # Features & Panels
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor,tempoServiceMap
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
      - GF_INSTALL_PLUGINS=marcusolsson-dynamictext-panel
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=marcusolsson-dynamictext-panel
    ports:
      - "${GRAFANA_BIND_IP:-0.0.0.0}:${GRAFANA_PORT:-3000}:3000" # Grafana UI
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --tries=1 -O- http://localhost:3000/api/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "${GRAFANA_CPU_LIMIT:-1.5}"
          memory: ${GRAFANA_MEMORY_LIMIT:-1G}
        reservations:
          cpus: "${GRAFANA_CPU_RESERVATION:-0.25}"
          memory: ${GRAFANA_MEMORY_RESERVATION:-256M}
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    networks:
      - observability_net

networks:
  observability_net:
    driver: bridge
    name: tracenest_observability_net

volumes:
  tempo_data:
  prometheus_data:
  grafana_data:
