[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tracenest"
version = "0.1.0"
description = "TraceNest: High-performance Python Observability SDK for OpenTelemetry"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "opentelemetry-instrumentation-django>=0.44b0",
    "opentelemetry-instrumentation-requests>=0.44b0",
    "opentelemetry-instrumentation-psycopg2>=0.44b0",
    "opentelemetry-instrumentation-redis>=0.44b0",
    "opentelemetry-instrumentation-botocore>=0.44b0",
    "wrapt>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "requests>=2.25.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
# Keep bare `pytest`/`pytest .` from wandering outside the suite if another
# throwaway scripts directory (or a vendored copy of tests) is ever added.
norecursedirs = ["scratch", "*.egg", ".*", "build", "dist", "node_modules"]
