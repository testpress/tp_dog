# ==============================================================================
# tp_trace - Observability server (production)
# ==============================================================================
# Runs on the host that holds the long-term observability data. This is the
# "different server" referred to in the deployment guide: Tempo + Prometheus +
# Grafana live here, while the Django app and the OTel Collector live on the app
# server (docker-compose.yml).
#
# Network topology (only 2 links cross the server boundary):
#
#   app server                          |  observability server (this file)
#   ----------------------------------- | --------------------------------------
#   django app --OTLP/HTTP :4318-->     |
#                                     collector
#        <-- Prometheus scrapes :8889 --|  (pull, from prometheus below)
#        collector --OTLP/gRPC :4317 -->|  (push, from tempo below)
#                                      tempo   --> Grafana :3200
#                                      prometheus --> Grafana :9090
#
# Firewall on THIS host must allow inbound:
#   4317/tcp  from the app server only  (collector pushes traces)
#   3200/tcp  from Grafana / operators  (Tempo query API)
#   9090/tcp  from Grafana / operators  (Prometheus query API)
#   3000/tcp  from operators            (Grafana UI)
# Firewall on the APP host must allow inbound:
#   8889/tcp  from this host only       (Prometheus scrapes spanmetrics)
#
# Usage:
#   cp .env.obs.example .env && edit it
#   docker compose -f docker-compose.obs.yml up -d
# ==============================================================================

services:
  tempo:
    image: grafana/tempo:2.4.1
    container_name: obs-tempo
    restart: unless-stopped
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    volumes:
      - ./docker/tempo/tempo-config.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      # 4317/4318 are the collectors that PUSH traces here. They must be
      # published (and firewalled) or a remote collector cannot reach Tempo.
      - "${TEMPO_OTLP_GRPC_PORT:-4317}:4317" # OTLP gRPC - the collector's push target
      - "${TEMPO_OTLP_HTTP_PORT:-4318}:4318" # OTLP HTTP - direct SDK / otel-collector users
      - "${TEMPO_QUERY_PORT:-3200}:3200"     # Tempo HTTP query API
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3200/ready" ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${TEMPO_MEMORY_LIMIT:-2G}

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: obs-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--enable-feature=exemplar-storage"
      # Traces are retained 14 days in Tempo, but Prometheus TSDB is the one that
      # must not fill the disk. Cap it explicitly rather than letting it grow.
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # PRODUCTION targets file: points at the app server's collector :8889.
      # Edit docker/prometheus/targets/otel-collector.prod.json and set the host.
      - ./docker/prometheus/targets/otel-collector.prod.json:/etc/prometheus/targets/otel-collector.prod.json:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090" # Web UI & Query API
    deploy:
      resources:
        limits:
          memory: ${PROMETHEUS_MEMORY_LIMIT:-2G}

  grafana:
    image: grafana/grafana:12.4.10
    container_name: obs-grafana
    restart: unless-stopped
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=${GF_AUTH_DISABLE_LOGIN_FORM:-false}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor,tempoServiceMap
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
      - GF_INSTALL_PLUGINS=marcusolsson-dynamictext-panel
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=marcusolsson-dynamictext-panel
    ports:
      - "${GRAFANA_PORT:-3000}:3000" # Grafana UI
    depends_on:
      - prometheus
      - tempo

volumes:
  tempo_data:
  prometheus_data:
  grafana_data: